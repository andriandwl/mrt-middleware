groups:
  - name: mrt-middleware
    rules:
      - alert: MiddlewareDown
        expr: up{job="mrt-middleware"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Middleware tidak bisa di-scrape"
          description: "/metrics di {{ $labels.instance }} tidak merespons selama 1 menit."

      - alert: DatabaseDown
        expr: mrt_mw_db_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Database tidak merespons"
          description: "Middleware gagal ping PostgreSQL selama 1 menit."

      - alert: ConnectorDown
        expr: mrt_mw_connector_up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Konektor {{ $labels.connector }} terputus"
          description: "Konektor {{ $labels.connector }} ({{ $labels.source }}) tidak tersambung selama 5 menit."

      - alert: ConnectorNoData
        expr: mrt_mw_connector_last_record_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Tidak ada data dari {{ $labels.connector }}"
          description: "Data terakhir dari {{ $labels.connector }} diterima {{ $value | humanizeDuration }} lalu."

      - alert: PersistErrors
        expr: sum by (connector) (rate(mrt_mw_persist_errors_total[5m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gagal simpan ke database ({{ $labels.connector }})"
          description: "Ada error persist terus-menerus selama 5 menit."

      - alert: RecordsDropped
        expr: sum by (connector) (increase(mrt_mw_records_dropped_total[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Record dibuang, antrian {{ $labels.connector }} penuh"
          description: "{{ $value | humanize }} record dibuang dalam 5 menit terakhir."

      - alert: HighRejectRate
        expr: |
          sum(rate(mrt_mw_records_rejected_total[5m]))
            / sum(rate(mrt_mw_records_received_total[5m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Lebih dari 5% record ditolak"
          description: "Rasio record ditolak {{ $value | humanizePercentage }} selama 10 menit. Cek mapping/parser."

      - alert: PipelineSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(mrt_mw_pipeline_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Pipeline lambat (p95 > 1 detik)"
          description: "Latensi p95 pipeline {{ $value | humanize }} detik."

      - alert: MaintenanceStale
        # interval maintenance default 60 menit
        expr: |
          mrt_mw_maintenance_last_success_timestamp_seconds > 0
            and time() - mrt_mw_maintenance_last_success_timestamp_seconds > 3 * 3600
        labels: { severity: warning }
        annotations:
          summary: "Maintenance database tidak berhasil > 3 jam"
          description: "Partisi, agregat per jam, dan retensi mungkin tertunda."

      - alert: DefaultPartitionRows
        expr: mrt_mw_default_partition_rows > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Ada baris di partisi default {{ $labels.table }}"
          description: "{{ $value }} baris masuk partisi default; partisi waktu mungkin belum dibuat."
